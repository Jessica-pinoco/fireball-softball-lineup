<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Fireball Lineup</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      color: #d62828;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    select, input, button, textarea {
      padding: 8px;
      margin: 4px;
    }

    select, input {
      width: 90%;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      background: #d62828;
      color: white;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 220px;
      box-sizing: border-box;
    }

    .manualBox {
      display: none;
      margin-top: 6px;
    }

    .warning {
      color: #d62828;
      font-weight: bold;
      margin-top: 10px;
    }

    canvas {
      max-width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>⚾️ Fireball Lineup 🔥</h1>

<div class="section">
  <h2>比賽資訊</h2>

  <p>比賽日期：<input id="gameDate" type="date"></p>
  <p>對手隊名：<input id="opponent" type="text" placeholder="請輸入對手"></p>

  <p>
    先攻先守：
    <select id="homeAway">
      <option>先攻</option>
      <option>先守</option>
    </select>
  </p>
</div>

<div class="section">
  <h2>先發名單</h2>

  <table>
    <thead>
      <tr>
        <th>棒次</th>
        <th>球員</th>
        <th>守備位置</th>
      </tr>
    </thead>
    <tbody id="lineupTable"></tbody>
  </table>

  <div id="duplicateWarning" class="warning"></div>
</div>

<div class="section">
  <h2>候補球員</h2>

  <table>
    <thead>
      <tr>
        <th>候補</th>
        <th>球員</th>
      </tr>
    </thead>
    <tbody id="benchTable"></tbody>
  </table>
</div>

<div class="section">
  <h2>LINE 文字版</h2>

  <button onclick="generateLineText()">產生 LINE 文字</button>
  <button onclick="copyLineText()">複製文字</button>

  <textarea id="lineText" placeholder="按下「產生 LINE 文字」後，這裡會出現排棒結果"></textarea>
</div>

<div class="section">
  <h2>守備位置圖</h2>

  <button onclick="drawField()">產生守備圖</button>
  <button onclick="downloadFieldImage()">下載守備圖</button>

  <br><br>

  <canvas id="fieldCanvas" width="600" height="520"></canvas>
</div>

<script>
  const players = [
    "#1 林升權",
    "#2 簡于翔",
    "#7 林申富",
    "#10 陳韋彤",
    "#11 黃博彥",
    "#13 李國豪",
    "#19 林展廷",
    "#24 朱祐陞",
    "#26 黃煜彬",
    "#31 吳旻育",
    "#39 林暐晉",
    "#41 何亦如",
    "#44 黃顏維霆",
    "#55 賴泱佐",
    "#69 曾鈺淀",
    "#72 黃顏斌丞",
    "#97 黃顏維辰",
    "#99 簡崇恩"
  ];

  const positions = ["P", "C", "1B", "2B", "3B", "SS", "10", "LF", "CF", "RF", "DH"];

  function playerOptions() {
    return `
      <option value="">請選擇球員</option>
      ${players.map(player => `<option value="${player}">${player}</option>`).join("")}
      <option value="manual">➕ 手動輸入球員</option>
    `;
  }

  function positionOptions() {
    return `
      <option value="">請選擇守備位置</option>
      ${positions.map(position => `<option value="${position}">${position}</option>`).join("")}
    `;
  }

  function createPlayerCell(idPrefix, index) {
    return `
      <select class="playerSelect" id="${idPrefix}Player${index}" onchange="handlePlayerChange('${idPrefix}', ${index}); checkDuplicates();">
        ${playerOptions()}
      </select>

      <div class="manualBox" id="${idPrefix}Manual${index}">
        <input id="${idPrefix}Number${index}" type="text" placeholder="背號">
        <input id="${idPrefix}Name${index}" type="text" placeholder="姓名">
      </div>
    `;
  }

  function handlePlayerChange(idPrefix, index) {
    const select = document.getElementById(`${idPrefix}Player${index}`);
    const manualBox = document.getElementById(`${idPrefix}Manual${index}`);
    manualBox.style.display = select.value === "manual" ? "block" : "none";
  }

  function getPlayerText(idPrefix, index) {
    const select = document.getElementById(`${idPrefix}Player${index}`);

    if (select.value === "manual") {
      const number = document.getElementById(`${idPrefix}Number${index}`).value.trim();
      const name = document.getElementById(`${idPrefix}Name${index}`).value.trim();

      if (!number && !name) return "";
      return `#${number} ${name}`;
    }

    return select.value;
  }

  const lineupTable = document.getElementById("lineupTable");

  for (let i = 1; i <= 11; i++) {
    lineupTable.innerHTML += `
      <tr>
        <td>${i}</td>
        <td>${createPlayerCell("lineup", i)}</td>
        <td>
          <select id="position${i}">
            ${positionOptions()}
          </select>
        </td>
      </tr>
    `;
  }

  const benchTable = document.getElementById("benchTable");

  for (let i = 1; i <= 6; i++) {
    benchTable.innerHTML += `
      <tr>
        <td>候補${i}</td>
        <td>${createPlayerCell("bench", i)}</td>
      </tr>
    `;
  }

  function checkDuplicates() {
    const selectedPlayers = [];

    for (let i = 1; i <= 11; i++) {
      const player = getPlayerText("lineup", i);
      if (player) selectedPlayers.push(player);
    }

    for (let i = 1; i <= 6; i++) {
      const player = getPlayerText("bench", i);
      if (player) selectedPlayers.push(player);
    }

    const duplicates = selectedPlayers.filter((player, index) => selectedPlayers.indexOf(player) !== index);
    const uniqueDuplicates = [...new Set(duplicates)];

    const warning = document.getElementById("duplicateWarning");

    warning.textContent = uniqueDuplicates.length > 0
      ? "⚠️ 重複選到：" + uniqueDuplicates.join("、")
      : "";
  }

  function generateLineText() {
    const date = document.getElementById("gameDate").value || "未填日期";
    const opponent = document.getElementById("opponent").value || "未填對手";
    const homeAway = document.getElementById("homeAway").value;

    let text = `🔥 Fireball Lineup\n`;
    text += `📅 ${date}\n`;
    text += `🆚 ${opponent}\n`;
    text += `⚾ ${homeAway}\n\n`;
    text += `【先發名單】\n`;

    for (let i = 1; i <= 11; i++) {
      const player = getPlayerText("lineup", i);
      const position = document.getElementById(`position${i}`).value;

      if (player) {
        text += `${i}棒｜${player}`;
        if (position) text += `｜${position}`;
        text += `\n`;
      }
    }

    const benchPlayers = [];

    for (let i = 1; i <= 6; i++) {
      const player = getPlayerText("bench", i);
      if (player) benchPlayers.push(player);
    }

    if (benchPlayers.length > 0) {
      text += `\n【候補】\n`;
      benchPlayers.forEach((player, index) => {
        text += `候補${index + 1}｜${player}\n`;
      });
    }

    document.getElementById("lineText").value = text;
    checkDuplicates();
  }

  function copyLineText() {
    const lineText = document.getElementById("lineText");
    lineText.select();
    document.execCommand("copy");
    alert("已複製，可以貼到 LINE 囉！");
  }

  function drawField() {
    const canvas = document.getElementById("fieldCanvas");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const W = canvas.width;
    const H = canvas.height;

    const grassDark = "#215b30";
    const grassLight = "#347b42";
    const dirt = "#a36d36";
    const white = "#ffffff";
    const marker = "#c99b5e";

    // 背景草地條紋
    for (let x = 0; x < W; x += 55) {
      ctx.fillStyle = (x / 55) % 2 === 0 ? grassDark : grassLight;
      ctx.fillRect(x, 0, 55, H);
    }

    // 外野弧線
    ctx.strokeStyle = "rgba(198,171,105,0.8)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(300, 400, 405, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();

    // 外野邊線
    ctx.strokeStyle = white;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(300, 410);
    ctx.lineTo(-10, 155);
    ctx.moveTo(300, 410);
    ctx.lineTo(610, 155);
    ctx.stroke();

    // 內野大土區
    ctx.fillStyle = dirt;
    ctx.beginPath();
    
    // 三壘側直邊起點
    ctx.moveTo(135, 335);
    
    // 往上接漂亮弧線
    ctx.lineTo(150, 305);
    
    // 上方大弧形
    ctx.quadraticCurveTo(300, 35, 450, 305);
    
    // 一壘側直邊
    ctx.lineTo(465, 335);
    
    // 右側往本壘收
    ctx.quadraticCurveTo(390, 375, 300, 430);
    
    // 左側往本壘收
    ctx.quadraticCurveTo(210, 375, 135, 335);
    
    ctx.closePath();
    ctx.fill();

    // 中間草地菱形，保留條紋
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(300, 410);
    ctx.lineTo(195, 305);
    ctx.lineTo(300, 200);
    ctx.lineTo(405, 305);
    ctx.closePath();
    ctx.clip();

    for (let x = 0; x < W; x += 55) {
      ctx.fillStyle = (x / 55) % 2 === 0 ? grassDark : grassLight;
      ctx.fillRect(x, 0, 55, H);
    }

    ctx.restore();

    // 壘包附近小內凹
    ctx.fillStyle = dirt;

    ctx.beginPath();
    ctx.arc(300, 200, 28, 0, Math.PI);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(195, 305, 28, -Math.PI / 2, Math.PI / 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(405, 305, 28, Math.PI / 2, Math.PI * 1.5);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(300, 410, 30, Math.PI, 0);
    ctx.fill();

    // 本壘圓形土區
    ctx.fillStyle = dirt;
    ctx.beginPath();
    ctx.arc(300, 410, 42, 0, Math.PI * 2);
    ctx.fill();

    // 壘線
    ctx.strokeStyle = white;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(300, 410);
    ctx.lineTo(195, 305);
    ctx.lineTo(300, 200);
    ctx.lineTo(405, 305);
    ctx.lineTo(300, 410);
    ctx.stroke();

    // 壘包
    ctx.fillStyle = white;
    ctx.fillRect(292, 192, 16, 16);
    ctx.fillRect(187, 297, 16, 16);
    ctx.fillRect(397, 297, 16, 16);

    // 本壘板
    ctx.beginPath();
    ctx.moveTo(288, 405);
    ctx.lineTo(312, 405);
    ctx.lineTo(312, 418);
    ctx.lineTo(300, 430);
    ctx.lineTo(288, 418);
    ctx.closePath();
    ctx.fill();

    // 打擊區
    ctx.strokeStyle = white;
    ctx.lineWidth = 2;
    ctx.strokeRect(270, 395, 14, 36);
    ctx.strokeRect(316, 395, 14, 36);

    const fieldPositions = {
      "P":  { x:300, y:320, title:"P",  subtitle:"投手" },
      "C":  { x:300, y:475, title:"C",  subtitle:"捕手" },
      "1B": { x:455, y:320, title:"1B", subtitle:"一壘手" },
      "2B": { x:390, y:230, title:"2B", subtitle:"二壘手" },
      "3B": { x:145, y:320, title:"3B", subtitle:"三壘手" },
      "SS": { x:215, y:230, title:"SS", subtitle:"游擊手" },
      "10": { x:385, y:125, title:"10", subtitle:"10洞" },
      "LF": { x:95,  y:140, title:"LF", subtitle:"左外野手" },
      "CF": { x:300, y:75,  title:"CF", subtitle:"中外野手" },
      "RF": { x:505, y:140, title:"RF", subtitle:"右外野手" }
    };

    const assigned = {};

    for (let i = 1; i <= 11; i++) {
      const player = getPlayerText("lineup", i);
      const position = document.getElementById(`position${i}`).value;

      if (fieldPositions[position] && player) {
        assigned[position] = player;
      }
    }

    Object.keys(fieldPositions).forEach(pos => {
      const info = fieldPositions[pos];
      const player = assigned[pos] || "未排";

      ctx.fillStyle = white;
      ctx.textAlign = "center";

      ctx.font = "bold 18px Arial";
      ctx.fillText(info.title, info.x, info.y - 30);

      ctx.font = "14px Arial";
      ctx.fillText(info.subtitle, info.x, info.y - 10);

      ctx.fillStyle = marker;
      ctx.beginPath();
      ctx.arc(info.x, info.y + 18, 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = white;
      ctx.font = "bold 11px Arial";

      const displayName = player.replace(/^#\d+\s*/, "");
      ctx.fillText(displayName, info.x, info.y + 22);
    });
  }

  function downloadFieldImage() {
    drawField();

    const canvas = document.getElementById("fieldCanvas");
    const link = document.createElement("a");

    link.download = "fireball-field.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }
</script>

</body>
</html>
