<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Fireball Lineup</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      padding: 20px;
      background:#f5f5f5;
    }
    h1{ color:#d62828; }
    .section{
      background:white;
      padding:20px;
      border-radius:10px;
      margin-bottom:20px;
    }
    table{
      width:100%;
      border-collapse: collapse;
      margin-top:10px;
    }
    th, td{
      border:1px solid #ccc;
      padding:8px;
      text-align:center;
    }
    select,input,button,textarea{
      padding:8px;
      margin:4px;
    }
    select,input{ width:90%; }
    button{
      cursor:pointer;
      border:0;
      border-radius:8px;
      background:#d62828;
      color:white;
      font-weight:bold;
    }
    textarea{
      width:100%;
      height:220px;
      box-sizing:border-box;
    }
    .manualBox{
      display:none;
      margin-top:6px;
    }
    .warning{
      color:#d62828;
      font-weight:bold;
      margin-top:10px;
    }
  </style>
</head>

<body>

<h1>🔥 Fireball Lineup</h1>

<div class="section">
  <h2>比賽資訊</h2>
  <p>比賽日期：<input id="gameDate" type="date"></p>
  <p>對手隊名：<input id="opponent" type="text" placeholder="請輸入對手"></p>
  <p>
    先攻先守：
    <select id="homeAway">
      <option>先攻</option>
      <option>先守</option>
    </select>
  </p>
</div>

<div class="section">
  <h2>先發名單</h2>
  <table>
    <thead>
      <tr>
        <th>棒次</th>
        <th>球員</th>
        <th>守備位置</th>
      </tr>
    </thead>
    <tbody id="lineupTable"></tbody>
  </table>
  <div id="duplicateWarning" class="warning"></div>
</div>

<div class="section">
  <h2>候補球員</h2>
  <table>
    <thead>
      <tr>
        <th>候補</th>
        <th>球員</th>
      </tr>
    </thead>
    <tbody id="benchTable"></tbody>
  </table>
</div>

<div class="section">
  <h2>LINE 文字版</h2>
  <button onclick="generateLineText()">產生 LINE 文字</button>
  <button onclick="copyLineText()">複製文字</button>
  <textarea id="lineText" placeholder="按下「產生 LINE 文字」後，這裡會出現排棒結果"></textarea>
</div>

<div class="section">
  <h2>守備位置圖</h2>
  <button onclick="drawField()">產生守備圖</button>
  <br><br>
  <canvas id="fieldCanvas" width="600" height="520" style="max-width:100%; border:1px solid #ccc; border-radius:10px;"></canvas>
</div>

<script>
  const players = [
    "#1 林升權",
    "#2 簡于翔",
    "#7 林申富",
    "#10 陳韋彤",
    "#11 黃博彥",
    "#13 李國豪",
    "#19 林展廷",
    "#24 朱祐陞",
    "#26 黃煜彬",
    "#31 吳旻育",
    "#39 林暐晉",
    "#41 何亦如",
    "#44 黃顏維霆",
    "#55 賴泱佐",
    "#69 曾鈺淀",
    "#72 黃顏斌丞",
    "#97 黃顏維辰",
    "#99 簡崇恩"
  ];

  const positions = ["P", "C", "1B", "2B", "3B", "SS", "10", "LF", "CF", "RF", "DH"];

  function playerOptions() {
    return `
      <option value="">請選擇球員</option>
      ${players.map(player => `<option value="${player}">${player}</option>`).join("")}
      <option value="manual">➕ 手動輸入球員</option>
    `;
  }

  function positionOptions() {
    return `
      <option value="">請選擇守備位置</option>
      ${positions.map(position => `<option value="${position}">${position}</option>`).join("")}
    `;
  }

  function createPlayerCell(idPrefix, index) {
    return `
      <select class="playerSelect" id="${idPrefix}Player${index}" onchange="handlePlayerChange('${idPrefix}', ${index); checkDuplicates();">
        ${playerOptions()}
      </select>
      <div class="manualBox" id="${idPrefix}Manual${index}">
        <input id="${idPrefix}Number${index}" type="text" placeholder="背號">
        <input id="${idPrefix}Name${index}" type="text" placeholder="姓名">
      </div>
    `;
  }

  function handlePlayerChange(idPrefix, index) {
    const select = document.getElementById(`${idPrefix}Player${index}`);
    const manualBox = document.getElementById(`${idPrefix}Manual${index}`);
    manualBox.style.display = select.value === "manual" ? "block" : "none";
  }

  function getPlayerText(idPrefix, index) {
    const select = document.getElementById(`${idPrefix}Player${index}`);

    if (select.value === "manual") {
      const number = document.getElementById(`${idPrefix}Number${index}`).value.trim();
      const name = document.getElementById(`${idPrefix}Name${index}`).value.trim();
      if (!number && !name) return "";
      return `#${number} ${name}`;
    }

    return select.value;
  }

  const lineupTable = document.getElementById("lineupTable");
  for (let i = 1; i <= 11; i++) {
    lineupTable.innerHTML += `
      <tr>
        <td>${i}</td>
        <td>${createPlayerCell("lineup", i)}</td>
        <td>
          <select id="position${i}">
            ${positionOptions()}
          </select>
        </td>
      </tr>
    `;
  }

  const benchTable = document.getElementById("benchTable");
  for (let i = 1; i <= 6; i++) {
    benchTable.innerHTML += `
      <tr>
        <td>候補${i}</td>
        <td>${createPlayerCell("bench", i)}</td>
      </tr>
    `;
  }

  function checkDuplicates() {
    const selectedPlayers = [];

    for (let i = 1; i <= 11; i++) {
      const player = getPlayerText("lineup", i);
      if (player) selectedPlayers.push(player);
    }

    for (let i = 1; i <= 6; i++) {
      const player = getPlayerText("bench", i);
      if (player) selectedPlayers.push(player);
    }

    const duplicates = selectedPlayers.filter((player, index) => selectedPlayers.indexOf(player) !== index);
    const uniqueDuplicates = [...new Set(duplicates)];
    const warning = document.getElementById("duplicateWarning");

    warning.textContent = uniqueDuplicates.length > 0
      ? "⚠️ 重複選到：" + uniqueDuplicates.join("、")
      : "";
  }

  function generateLineText() {
    const date = document.getElementById("gameDate").value || "未填日期";
    const opponent = document.getElementById("opponent").value || "未填對手";
    const homeAway = document.getElementById("homeAway").value;

    let text = `🔥 Fireball Lineup\n`;
    text += `📅 ${date}\n`;
    text += `🆚 ${opponent}\n`;
    text += `⚾ ${homeAway}\n\n`;
    text += `【先發名單】\n`;

    for (let i = 1; i <= 11; i++) {
      const player = getPlayerText("lineup", i);
      const position = document.getElementById(`position${i}`).value;

      if (player) {
        text += `${i}棒｜${player}`;
        if (position) text += `｜${position}`;
        text += `\n`;
      }
    }

    const benchPlayers = [];
    for (let i = 1; i <= 6; i++) {
      const player = getPlayerText("bench", i);
      if (player) benchPlayers.push(player);
    }

    if (benchPlayers.length > 0) {
      text += `\n【候補】\n`;
      benchPlayers.forEach((player, index) => {
        text += `候補${index + 1}｜${player}\n`;
      });
    }

    document.getElementById("lineText").value = text;
    checkDuplicates();
  }

  function copyLineText() {
    const lineText = document.getElementById("lineText");
    lineText.select();
    document.execCommand("copy");
    alert("已複製，可以貼到 LINE 囉！");
  }

  function drawField() {
    const canvas = document.getElementById("fieldCanvas");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#0b8f3a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#c68642";
    ctx.beginPath();
    ctx.moveTo(300, 390);
    ctx.lineTo(190, 280);
    ctx.lineTo(300, 170);
    ctx.lineTo(410, 280);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(300, 390);
    ctx.lineTo(190, 280);
    ctx.lineTo(300, 170);
    ctx.lineTo(410, 280);
    ctx.lineTo(300, 390);
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,255,255,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(300, 390);
    ctx.lineTo(70, 130);
    ctx.moveTo(300, 390);
    ctx.lineTo(530, 130);
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(292, 382, 16, 16);
    ctx.fillRect(182, 272, 16, 16);
    ctx.fillRect(292, 162, 16, 16);
    ctx.fillRect(402, 272, 16, 16);

    const fieldPositions = {
      "P":  { x:300, y:300 },
      "C":  { x:300, y:435 },
      "1B": { x:430, y:275 },
      "2B": { x:360, y:210 },
      "3B": { x:170, y:275 },
      "SS": { x:240, y:210 },
      "10": { x:300, y:140 },
      "LF": { x:120, y:110 },
      "CF": { x:300, y:70 },
      "RF": { x:480, y:110 }
    };

    const assigned = {};

    for (let i = 1; i <= 11; i++) {
      const player = getPlayerText("lineup", i);
      const position = document.getElementById(`position${i}`).value;

      if (fieldPositions[position]) {
        assigned[position] = player || "未選球員";
      }
    }

    Object.keys(fieldPositions).forEach(pos => {
      const info = fieldPositions[pos];
      const player = assigned[pos] || "未排";

      ctx.fillStyle = "#ffdd00";
      ctx.beginPath();
      ctx.arc(info.x, info.y, 28, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#d62828";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#000";
      ctx.font = "bold 14px Arial";
      ctx.textAlign = "center";
      ctx.fillText(pos, info.x, info.y - 8);

      ctx.font = "12px Arial";
      ctx.fillText(player, info.x, info.y + 10);
    });

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 22px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Fireball 守備位置圖", 300, 35);
  }
</script>

</body>
</html>
