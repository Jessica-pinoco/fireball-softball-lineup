<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Fireball Lineup</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      padding: 20px;
      background:#f5f5f5;
    }

    h1{ color:#d62828; }

    .section{
      background:white;
      padding:20px;
      border-radius:10px;
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse: collapse;
      margin-top:10px;
    }

    th, td{
      border:1px solid #ccc;
      padding:8px;
      text-align:center;
    }

    select,input{
      padding:5px;
      width:90%;
    }
  </style>
</head>

<body>

<h1>🔥 Fireball Lineup</h1>

<div class="section">
  <h2>比賽資訊</h2>

  <p>比賽日期：<input type="date"></p>
  <p>對手隊名：<input type="text" placeholder="請輸入對手"></p>

  <p>
    先攻先守：
    <select>
      <option>先攻</option>
      <option>先守</option>
    </select>
  </p>
</div>

<div class="section">
  <h2>先發名單</h2>

  <table>
    <thead>
      <tr>
        <th>棒次</th>
        <th>球員</th>
        <th>守備位置</th>
      </tr>
    </thead>
    <tbody id="lineupTable"></tbody>
  </table>
</div>

<div class="section">
  <h2>候補球員</h2>

  <table>
    <thead>
      <tr>
        <th>候補</th>
        <th>球員</th>
      </tr>
    </thead>
    <tbody id="benchTable"></tbody>
  </table>
</div>

<script>
  const players = [
    "#1 林升權",
    "#2 簡于翔",
    "#7 林申富",
    "#10 陳韋彤",
    "#11 黃博彥",
    "#13 李國豪",
    "#19 林展廷",
    "#24 朱祐陞",
    "#26 黃煜彬",
    "#31 吳旻育",
    "#39 林暐晉",
    "#41 何亦如",
    "#44 黃顏維霆",
    "#55 賴泱佐",
    "#69 曾鈺淀",
    "#72 黃顏斌丞",
    "#97 黃顏維辰",
    "#99 簡崇恩",
    "➕ 手動輸入球員"
  ];

  const positions = [
    "P",
    "C",
    "1B",
    "2B",
    "3B",
    "SS",
    "10",
    "LF",
    "CF",
    "RF",
    "DH"
  ];

  function playerOptions() {
    return players.map(player => `<option>${player}</option>`).join("");
  }

  function positionOptions() {
    return positions.map(position => `<option>${position}</option>`).join("");
  }

  const lineupTable = document.getElementById("lineupTable");

  for (let i = 1; i <= 11; i++) {
    lineupTable.innerHTML += `
      <tr>
        <td>${i}</td>
        <td>
          <select>
            <option value="">請選擇球員</option>
            ${playerOptions()}
          </select>
        </td>
        <td>
          <select>
            <option value="">請選擇守備位置</option>
            ${positionOptions()}
          </select>
        </td>
      </tr>
    `;
  }

  const benchTable = document.getElementById("benchTable");

  for (let i = 1; i <= 6; i++) {
    benchTable.innerHTML += `
      <tr>
        <td>候補${i}</td>
        <td>
          <select>
            <option value="">請選擇球員</option>
            ${playerOptions()}
          </select>
        </td>
      </tr>
    `;
  }
</script>

</body>
</html>
