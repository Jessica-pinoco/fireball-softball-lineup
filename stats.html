<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Fireball Stats</title>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { color: #d62828; }
    .section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    input, button { padding: 8px; margin: 4px; }
    input { width: 80%; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      background: #0C2340;
      color: white;
      font-weight: bold;
    }

    .topStatsBtn {
      background: transparent;
      color: #666;
      font-size: 13px;
      font-weight: normal;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 999px;
    }

    .topStatsBtn:hover { background: #eeeeee; }

    .deleteBtn { background: #d62828; }
  </style>
</head>

<body>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
  <h1 style="margin:0;">📊 Fireball 數據管理</h1>

  <button class="topStatsBtn" onclick="location.href='index.html'">
    ⬅️ 回排棒頁
  </button>
</div>

<div class="section">
  <h2>新增本場比賽</h2>
  <p>比賽日期：<input id="gameDate" type="date"></p>
  <p>對手隊名：<input id="opponent" type="text" placeholder="請輸入對手"></p>

  <table>
    <thead>
      <tr>
        <th>球員</th>
        <th>本場打數 AB</th>
        <th>本場安打 H</th>
      </tr>
    </thead>
    <tbody id="gameStatsTable"></tbody>
  </table>

  <br>
  <button onclick="saveGameRecord()">💾 儲存本場紀錄</button>
</div>

<div class="section">
  <h2>累積打擊率</h2>
  <button onclick="loadCloudData()">🔄 重新整理</button>

  <table>
    <thead>
      <tr>
        <th>球員</th>
        <th>累積 AB</th>
        <th>累積 H</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="summaryTable"></tbody>
  </table>
</div>

<div class="section">
  <h2>歷史比賽紀錄</h2>
  <div id="historyList"></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzy5_vTQ4XLUf32U7iHvw5JvNbH4H6z1cXPLo5XqKAEhSK0v555UAVJh5qJw6RVf7w/exec";

  const players = [
    "#1 林升權",
    "#2 簡于翔",
    "#7 林申富",
    "#11 黃博彥",
    "#13 李國豪",
    "#19 林展廷",
    "#24 朱祐陞",
    "#26 黃煜彬",
    "#31 吳旻育",
    "#42 林暐晉",
    "#44 黃顏維霆",
    "#55 賴泱佐",
    "#69 曾鈺淀",
    "#72 黃顏斌丞",
    "#86 黃楷宸",
    "#97 黃顏維辰",
    "#99 簡崇恩"
  ];

  let gameRecords = [];

  function calculateAVG(H, AB) {
    if (!AB || AB === 0) return ".000";
    return (H / AB).toFixed(3).replace(/^0/, "");
  }

  function renderGameStatsTable() {
    const table = document.getElementById("gameStatsTable");
    table.innerHTML = "";

    players.forEach((player, index) => {
      table.innerHTML += `
        <tr>
          <td>${player}</td>
          <td><input id="ab${index}" type="number" min="0" value="0"></td>
          <td><input id="h${index}" type="number" min="0" value="0"></td>
        </tr>
      `;
    });
  }

  async function saveGameRecord() {
    const date = document.getElementById("gameDate").value;
    const opponent = document.getElementById("opponent").value.trim();

    if (!date) {
      alert("請先填比賽日期");
      return;
    }

    const records = [];
    let hasError = false;

    players.forEach((player, index) => {
      const AB = Number(document.getElementById(`ab${index}`).value || 0);
      const H = Number(document.getElementById(`h${index}`).value || 0);

      if (H > AB) {
        alert(`${player} 的安打數不能大於打數`);
        hasError = true;
        return;
      }

      if (AB > 0 || H > 0) {
        records.push({ date, opponent, player, AB, H });
      }
    });

    if (hasError) return;

    if (records.length === 0) {
      alert("請至少輸入一位球員的本場數據");
      return;
    }

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ records })
      });

      alert("已儲存！");
      await loadCloudData();
      renderGameStatsTable();

    } catch (error) {
      alert("儲存失敗，請稍後再試");
      console.error(error);
    }
  }

  async function deleteGameRecord(date, opponent) {
    if (!confirm(`確定要刪除 ${date} vs ${opponent || "未填對手"} 這場紀錄嗎？`)) return;

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "delete",
          date,
          opponent
        })
      });

      alert("已刪除！");
      await loadCloudData();

    } catch (error) {
      alert("刪除失敗，請稍後再試");
      console.error(error);
    }
  }

  function getPlayerSummary() {
    const summary = {};

    players.forEach(player => {
      summary[player] = { AB: 0, H: 0 };
    });

    gameRecords.forEach(record => {
      record.stats.forEach(item => {
        if (!summary[item.player]) {
          summary[item.player] = { AB: 0, H: 0 };
        }

        summary[item.player].AB += Number(item.AB || 0);
        summary[item.player].H += Number(item.H || 0);
      });
    });

    return summary;
  }

  function renderSummaryTable() {
    const table = document.getElementById("summaryTable");
    const summary = getPlayerSummary();

    table.innerHTML = "";

    players.forEach(player => {
      const AB = summary[player].AB;
      const H = summary[player].H;
      const avg = calculateAVG(H, AB);

      table.innerHTML += `
        <tr>
          <td>${player}</td>
          <td>${AB}</td>
          <td>${H}</td>
          <td>${avg}</td>
        </tr>
      `;
    });
  }

  function renderHistoryList() {
    const history = document.getElementById("historyList");
    history.innerHTML = "";

    if (gameRecords.length === 0) {
      history.innerHTML = "<p>目前還沒有比賽紀錄</p>";
      return;
    }

    gameRecords
      .slice()
      .reverse()
      .forEach(record => {
        const rows = record.stats.map(item => `
          <tr>
            <td>${item.player}</td>
            <td>${item.AB}</td>
            <td>${item.H}</td>
            <td>${calculateAVG(item.H, item.AB)}</td>
          </tr>
        `).join("");

        history.innerHTML += `
          <div class="section" style="background:#fafafa;">
            <h3>${record.date} vs ${record.opponent || "未填對手"}</h3>

            <table>
              <thead>
                <tr>
                  <th>球員</th>
                  <th>AB</th>
                  <th>H</th>
                  <th>AVG</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>

            <button class="deleteBtn" onclick="deleteGameRecord('${record.date}', '${record.opponent || ""}')">
              🗑️ 刪除此紀錄
            </button>
          </div>
        `;
      });
  }

  function renderAll() {
    renderGameStatsTable();
    renderSummaryTable();
    renderHistoryList();
  }

  async function loadCloudData() {
    try {
      const response = await fetch(API_URL + "?time=" + Date.now());
      const rows = await response.json();

      gameRecords = [];
      const grouped = {};
      
  rows.forEach(row => {
      if (!row.date || !row.player) return;
      
      let date = String(row.date);
      
      if (date.includes("T")) {
        const d = new Date(date);
        const taiwanDate = new Date(d.getTime() + 8 * 60 * 60 * 1000);
        date = taiwanDate.toISOString().slice(0, 10);
  }

  const opponent = row.opponent || "";
  const key = `${date}_${opponent}`;

        if (!grouped[key]) {
          grouped[key] = {
            id: key,
            date,
            opponent,
            stats: []
          };
        }

        grouped[key].stats.push({
          player: row.player,
          AB: Number(row.AB || 0),
          H: Number(row.H || 0)
        });
      });

      gameRecords = Object.values(grouped);
      renderSummaryTable();
      renderHistoryList();

    } catch (error) {
      console.error("讀取 Google Sheet 失敗", error);
    }
  }

  renderAll();
  loadCloudData();
</script>

</body>
</html>
